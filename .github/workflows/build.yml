name: Build Bombchu Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    strategy:
      fail-fast: false
      matrix:
        platform: [ wii, gc ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install libogc2
      run: |
        dkp-pacman-key --recv-keys C8A2759C315CFBC3429CC2E422B803BA8AA3D7CE --keyserver hkps://keyserver.ubuntu.com
        dkp-pacman-key --lsign-key C8A2759C315CFBC3429CC2E422B803BA8AA3D7CE
        # The libogc2 repo must come before [dkp-libs] so its packages take precedence
        sed -i '/^\[dkp-libs\]/i [libogc2-devkitpro]\nServer = https://packages.libogc2.org/devkitpro/linux/$arch\nServer = https://packages.extremscorner.org/devkitpro/linux/$arch\n' /opt/devkitpro/pacman/etc/pacman.conf
        dkp-pacman -Sy --noconfirm --needed libogc2 libogc2-libdvm
        ls /opt/devkitpro/libogc2/lib/wii /opt/devkitpro/libogc2/lib/cube

    - name: Build project
      run: make PLATFORM=${{ matrix.platform }}

    - name: Upload DOL artifact
      uses: actions/upload-artifact@v4
      with:
        name: bombchu-${{ matrix.platform }}
        path: bombchu-${{ matrix.platform }}.dol
        if-no-files-found: error

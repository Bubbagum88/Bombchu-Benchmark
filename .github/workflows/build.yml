name: Build Bombchu Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    strategy:
      fail-fast: false
      matrix:
        platform: [ wii, gc ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build project
      run: make PLATFORM=${{ matrix.platform }}

    - name: Upload DOL artifact
      uses: actions/upload-artifact@v4
      with:
        name: bombchu-${{ matrix.platform }}
        path: bombchu-${{ matrix.platform }}.dol
        if-no-files-found: error
